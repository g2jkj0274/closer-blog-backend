# 푸시와 PR마다 빌드하고 테스트를 돌린다 (docs/tech-stack.md 2절 "CI")
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 앞서 돌던 실행을 멈춘다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 배포판과 의존성을 캐시한다
      - uses: gradle/actions/setup-gradle@v6

      # 테스트가 Testcontainers로 PostgreSQL을 띄운다. ubuntu 러너에는 Docker가 들어 있다
      - name: Build and test
        run: ./gradlew build

      # 실패하면 테스트 보고서를 Actions 화면에서 내려받을 수 있게 올린다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 배포 이미지가 만들어지고 실제로 뜨는지 본다. 이미지는 어디에도 올리지 않는다. build와 함께 돈다
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: closer_blog
          POSTGRES_USER: closer
          POSTGRES_PASSWORD: closer
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closer -d closer_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t closer-blog-server:ci .

      # 운영 프로필로 띄워 health가 UP인지 본다. 러너에서 --network host면 localhost가 위의 postgres다
      - name: Start image and check health
        run: |
          docker run -d --name app --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/closer_blog \
            -e SPRING_DATASOURCE_USERNAME=closer \
            -e SPRING_DATASOURCE_PASSWORD=closer \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else-0123 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            closer-blog-server:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            # 환경 변수가 빠지는 등으로 앱이 시작하다 멈췄으면 2분을 기다리지 않는다
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != true ]; then
              echo "앱이 시작하다 멈췄다"
              exit 1
            fi
            sleep 2
          done
          echo "2분 안에 health가 UP이 되지 않았다"
          exit 1

      - name: Show app log
        if: always()
        run: docker logs app || true

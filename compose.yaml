services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: closer_blog
      POSTGRES_USER: closer
      POSTGRES_PASSWORD: closer
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closer -d closer_blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

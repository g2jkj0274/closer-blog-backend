spring:
  application:
    name: blog-server
  jpa:
    open-in-view: false     # 요청이 끝날 때 까지 DB 연결을 붙잡지 않게 한다.
    hibernate:
      ddl-auto: validate      # Hibernate는 테이블을 만들고나 고치지 않고, 엔티티와 테이블이 맞는지 검사한 한다.
  docker:
    compose:
      lifecycle-management: start-only      # 앱을 켤 때, compose.yaml의 DB가 꺼져 있으면 띄우고, 앱을 끌 때는 DB를 그대로 둔다.

app:
  jwt:
    # 로컬 개발용 기본값. 운영에서는 반드시 환경 변수 JWT_SECRET으로 바꾼다.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-prod}
    access-token-ttl: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    refresh-token:
      persistent-ttl: 30d   # 로그인 유지
      session-ttl: 24h      # 로그인 유지 안 함 (쿠키는 브라우저를 닫으면 사라짐)
      cookie-secure: true
      rotation-grace: 30s   # 다른 탭이 방금 회전한 옛 토큰을 받아 주는 시간